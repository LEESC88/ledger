name: Build & Release Android APK

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Read Version from public/version.json
        id: version
        run: |
          node -e '
            const fs = require("fs");
            const v = JSON.parse(fs.readFileSync("./public/version.json", "utf8"));
            const out = process.env.GITHUB_OUTPUT;
            const flags = [];
            if (v.forceUpdate) flags.push("[FORCE]");
            if (v.minSupportedVersion) flags.push(`[MIN:${v.minSupportedVersion}]`);
            fs.appendFileSync(out, `VERSION=${v.version || ""}\n`);
            fs.appendFileSync(out, `NOTES=${String(v.notes || "").replace(/[\r\n]+/g, " ")}\n`);
            fs.appendFileSync(out, `POLICY_TAGS=${flags.join(" ")}\n`);
          '

      - name: Install Capacitor & Sync Android Web Assets
        run: |
          node -e "const fs = require('fs'); fs.writeFileSync('package.json', JSON.stringify({ name: 'monetax-apk', version: '${{ steps.version.outputs.VERSION }}', dependencies: { '@capacitor/core': '^6.0.0', '@capacitor/cli': '^6.0.0', '@capacitor/android': '^6.0.0' } }, null, 2));"
          rm -f package-lock.json
          npm install --no-audit --no-fund
          npx cap sync android

      - name: Decode Release Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Error: Missing Android signing secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Build Signed Release Android APK via Gradle
        working-directory: ./android
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../MonetaX.apk
          cp app/build/outputs/apk/release/app-release.apk ../MonetaX-v${{ steps.version.outputs.VERSION }}.apk
          cp app/build/outputs/apk/release/app-release.apk ../LEDGER.apk
          rm -f app/release.keystore

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonetaX-APK-v${{ steps.version.outputs.VERSION }}
          path: |
            MonetaX.apk
            MonetaX-v${{ steps.version.outputs.VERSION }}.apk
            LEDGER.apk

      - name: Publish Signed APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: MonetaX v${{ steps.version.outputs.VERSION }} (Signed Android APK)
          body: |
            ## 📱 MonetaX v${{ steps.version.outputs.VERSION }} — Official Signed Android APK Release

            ${{ steps.version.outputs.NOTES }}
            ${{ steps.version.outputs.POLICY_TAGS }}

            ### 📥 Direct Download
            Download **`MonetaX.apk`** below and install it directly on your Android device (V1/V2 Production Keystore Signed).

            - **Architecture**: Standalone Local-First + Direct Supabase Cloud Sync (No separate backend server needed)
            - **Highlights**: Click-to-Edit Transactions • 360° Anti-Peeking Privacy Mode (`👁️`) • Dynamic Monthly Budgets & Sinking Funds • Split Bill Claims
          files: |
            MonetaX.apk
            MonetaX-v${{ steps.version.outputs.VERSION }}.apk
            LEDGER.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
