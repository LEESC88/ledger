name: Build & Release Android APK

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Read Version from public/version.json
        id: version
        run: |
          VERSION=$(node -e "const fs = require('fs'); console.log(JSON.parse(fs.readFileSync('./public/version.json', 'utf8')).version);")
          NOTES=$(node -e "const fs = require('fs'); console.log(JSON.parse(fs.readFileSync('./public/version.json', 'utf8')).notes);")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "NOTES=$NOTES" >> $GITHUB_OUTPUT

      - name: Install Capacitor & Sync Android Web Assets
        run: |
          node -e "const fs = require('fs'); fs.writeFileSync('package.json', JSON.stringify({ name: 'monetax-apk', version: '${{ steps.version.outputs.VERSION }}', dependencies: { '@capacitor/core': '^6.0.0', '@capacitor/cli': '^6.0.0', '@capacitor/android': '^6.0.0' } }, null, 2));"
          rm -f package-lock.json
          npm install --no-audit --no-fund
          npx cap sync android

      - name: Build Signed Release Android APK via Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../MonetaX.apk
          cp app/build/outputs/apk/release/app-release.apk ../MonetaX-v${{ steps.version.outputs.VERSION }}.apk
          cp app/build/outputs/apk/release/app-release.apk ../LEDGER.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonetaX-APK-v${{ steps.version.outputs.VERSION }}
          path: |
            MonetaX.apk
            MonetaX-v${{ steps.version.outputs.VERSION }}.apk
            LEDGER.apk

      - name: Publish Signed APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: MonetaX v${{ steps.version.outputs.VERSION }} (Signed Android APK)
          body: |
            ## 📱 MonetaX v${{ steps.version.outputs.VERSION }} — Official Signed Android APK Release

            ${{ steps.version.outputs.NOTES }}

            ### 📥 Direct Download
            Download **`MonetaX.apk`** below and install it directly on your Android device (V1/V2 Production Keystore Signed).

            - **Architecture**: Standalone Local-First + Direct Supabase Cloud Sync (No separate backend server needed)
            - **Highlights**: Click-to-Edit Transactions • 360° Anti-Peeking Privacy Mode (`👁️`) • Dynamic Monthly Budgets & Sinking Funds • Split Bill Claims
          files: |
            MonetaX.apk
            MonetaX-v${{ steps.version.outputs.VERSION }}.apk
            LEDGER.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
